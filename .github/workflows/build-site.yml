name: Build and deploy static site

on:
  workflow_call:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout consuming repo
        uses: actions/checkout@v4

      - name: Download foxbase binary
        run: |
          curl -L -o foxbase https://raw.githubusercontent.com/yellowmoss/foxbase/main/foxbase
          chmod +x foxbase

      - name: Build site
        run: |
          # adjust input directory if needed (e.g. content/)
          ./foxbase -d content -o dist

          if [ ! -d "dist" ] || [ -z "$(ls -A dist)" ]; then
            echo "Build failed: dist is missing or empty"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add dist
          git commit -m "Temp commit of built site" || echo "No changes to commit"

      - name: Deploy to orphan site branch
        run: |
          git checkout --orphan site
          git rm -rf . ':(exclude)dist'
          git clean -fdx

          set -e
          cd "$(git rev-parse --show-toplevel)"
          [ -d dist ] || { echo "dist/ missing"; exit 1; }

          mv dist/* .
          rmdir dist

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Build site"
          git push -f origin s;ite
